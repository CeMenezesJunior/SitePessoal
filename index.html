<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfólio de Carlos Menezes, desenvolvedor de software." />
    <title>Carlos Menezes — Desenvolvedor de Software</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#edf0f7; --muted:#9da6b9; --line:rgba(237,240,247,.13); --accent:#a3ff3f; --bg:#090a0d; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; color:var(--ink); background:var(--bg); font-family:Manrope, sans-serif; min-height:100vh; }
      .nav { position:fixed; z-index:10; inset:0 0 auto; height:76px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(24px,6vw,88px); border-bottom:1px solid var(--line); background:rgba(9,10,13,.76); backdrop-filter:blur(16px); }
      .brand { color:var(--ink); font:500 13px 'DM Mono',monospace; letter-spacing:.08em; text-decoration:none; }
      .nav a:not(.brand) { color:var(--ink); font:500 13px 'DM Mono',monospace; text-decoration:none; padding:9px 0; border-bottom:1px solid var(--accent); }
      main { overflow:hidden; }
      .hero { position:relative; min-height:calc(100vh - 108px); display:grid; grid-template-columns:1.08fr .92fr; align-items:center; gap:clamp(35px,8vw,120px); max-width:1440px; margin:auto; padding:140px clamp(24px,8vw,120px) 72px; }
      .hero::before { content:""; position:absolute; width:560px; height:560px; left:-210px; top:120px; background:radial-gradient(circle,rgba(163,255,63,.17),transparent 65%); pointer-events:none; }
      .eyebrow { margin:0 0 26px; color:var(--accent); font:500 12px 'DM Mono',monospace; letter-spacing:.11em; text-transform:uppercase; }
      h1 { position:relative; margin:0; max-width:760px; font-size:clamp(3.3rem,8vw,7.7rem); line-height:.93; letter-spacing:-.075em; }
      h1 span { display:block; color:var(--accent); }
      .intro { max-width:510px; margin:34px 0 0; color:var(--muted); font-size:clamp(1rem,1.6vw,1.22rem); line-height:1.72; }
      .available { display:inline-flex; align-items:center; gap:10px; margin-top:40px; color:var(--ink); font:500 12px 'DM Mono',monospace; letter-spacing:.035em; }
      .available i { width:9px; height:9px; background:var(--accent); border-radius:50%; box-shadow:0 0 0 6px rgba(163,255,63,.1); }
      .portrait-wrap { position:relative; width:min(100%,430px); justify-self:end; }
      .portrait-wrap::before { content:""; position:absolute; inset:-18px 18px 18px -18px; border:1px solid var(--line); }
      .portrait { position:relative; display:block; width:100%; aspect-ratio: .84; object-fit:cover; filter:grayscale(100%) contrast(1.08); }
      .portrait-tag { position:absolute; bottom:18px; left:-32px; padding:12px 14px; background:var(--accent); color:#11140c; font:500 11px 'DM Mono',monospace; letter-spacing:.05em; }
      .number { position:absolute; right:-20px; top:25px; color:var(--muted); writing-mode:vertical-rl; font:400 11px 'DM Mono',monospace; letter-spacing:.11em; }
      footer { max-width:1440px; margin:auto; display:flex; justify-content:space-between; align-items:center; gap:25px; padding:29px clamp(24px,8vw,120px); border-top:1px solid var(--line); }
      .copyright { margin:0; color:var(--muted); font:400 11px 'DM Mono',monospace; }
      .socials { display:flex; flex-wrap:wrap; gap:22px; }
      .socials a { color:var(--ink); font:500 12px 'DM Mono',monospace; text-decoration:none; transition:color .2s ease; }
      .socials a:hover { color:var(--accent); }
      @media (max-width:760px) { .hero { grid-template-columns:1fr; padding-top:130px; gap:60px; } .portrait-wrap { justify-self:start; width:min(82vw,370px); margin-left:18px; } h1 { font-size:clamp(3.2rem,15vw,5.2rem); } footer { align-items:flex-start; flex-direction:column; } .portrait-tag { left:-18px; } }
    </style>
  </head>
  <body>
    <header class="nav">
      <a class="brand" href="#home">CM / 2026</a>
      <a href="#home">Home</a>
    </header>

    <main id="home">
      <section class="hero" aria-labelledby="title">
        <div>
          <p class="eyebrow">Olá, eu sou</p>
          <h1 id="title">Carlos <span>Menezes</span></h1>
          <p class="intro">Desenvolvedor de software. Transformo ideias complexas em produtos digitais simples, rápidos e memoráveis.</p>
          <span class="available"><i></i> DISPONÍVEL PARA NOVOS PROJETOS</span>
        </div>
        <div class="portrait-wrap">
          <span class="number">01 — INTRODUÇÃO</span>
          <img class="portrait" src="assets/carlos-menezes.jpg" alt="Retrato de Carlos Menezes" />
          <span class="portrait-tag">DESENVOLVEDOR DE SOFTWARE</span>
        </div>
      </section>
    </main>

    <footer>
      <p class="copyright">© 2026 CARLOS MENEZES</p>
      <nav class="socials" aria-label="Redes sociais">
        <a href="https://github.com/CeMenezesJunior" target="_blank" rel="noreferrer">GITHUB ↗</a>
        <a href="https://www.linkedin.com/in/cemenezesjunior/" target="_blank" rel="noreferrer">LINKEDIN ↗</a>
        <a href="https://www.instagram.com/cemenezesjr/" target="_blank" rel="noreferrer">INSTAGRAM ↗</a>
        <a href="mailto:cemenezesjr@gmail.com">E-MAIL ↗</a>
      </nav>
    </footer>
  </body>
</html>
